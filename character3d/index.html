<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Teen Character – 3D Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; background: #1b1d24; overflow: hidden; }
  canvas { display: block; }
  body.interactive canvas { width: 100vw; height: 100vh; }
  #ui {
    position: fixed; top: 0; right: 0; bottom: 0; width: 300px;
    background: #23262e; color: #cfd6e4; padding: 14px; overflow-y: auto;
    font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #ui .group { margin-bottom: 10px; }
  #ui .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8a93a6; margin-bottom: 4px; }
  #ui button {
    display: inline-block; margin: 2px; padding: 4px 8px; font: inherit;
    background: #2e3340; color: #cfd6e4; border: 1px solid #3a4150; border-radius: 4px; cursor: pointer;
  }
  #ui button:hover { background: #3a4150; }
  #ui button.on { background: #2e6fd8; border-color: #4a8af0; color: #fff; }
  #bar {
    position: fixed; left: 0; bottom: 0; padding: 10px 14px; display: none; gap: 8px;
    font: 13px ui-monospace, monospace;
  }
  body.interactive #bar { display: flex; }
  #bar button {
    font: inherit; padding: 8px 14px; background: #2e6fd8; color: #fff;
    border: none; border-radius: 4px; cursor: pointer;
  }
  #bar button.on { outline: 2px solid #fff; }
  #bar button { background: #3a4150; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui"></div>
<div id="bar"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
